packages:
  - apps/*
  - packages/*

# Dependencies that need their build scripts to run during install.
allowBuilds:
  # v13 ships Node-API binaries. pnpm otherwise infers `node-gyp rebuild` from
  # binding.gyp even though the package declares `gypfile: false`; PwrGit's
  # desktop postinstall stages both runtime-owned copies instead.
  better-sqlite3: false
  dugite: true
  electron: true
  electron-winstaller: true
  esbuild: true

# The @pwrdrvr/agent-kit packages are PwrDrvr's own, freshly published, and
# pinned — exempt them from any minimumReleaseAge gate so PwrGit can consume
# new versions immediately.
minimumReleaseAgeExclude:
  - "@pwrdrvr/codex-app-server-protocol"
  - "@pwrdrvr/agent-core"
  - "@pwrdrvr/agent-transport"
  - "@pwrdrvr/codex-discovery"
  - "@pwrdrvr/agent-client"
  - "@pwrdrvr/agent-acp"
  - "@pwrdrvr/agent-chat-react"
