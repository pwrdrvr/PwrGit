packages:
  - apps/*
  - packages/*

# Dependencies that need their build scripts to run during install.
allowBuilds:
  # v13 ships Node-API binaries. pnpm otherwise infers `node-gyp rebuild` from
  # binding.gyp even though the package declares `gypfile: false`; PwrGit's
  # desktop postinstall stages both runtime-owned copies instead.
  better-sqlite3: false
  dugite: true
  electron: true
  electron-winstaller: true
  esbuild: true

# Supply-chain cooldown: refuse to resolve any npm release younger than seven
# days (10080 minutes), so a compromised publish has a week to be caught and
# unpublished before it can reach a PwrGit build. Matches PwrAgnt and PwrSnap.
#
# This has to live here rather than in a developer's own pnpm config. The gate
# is only re-applied when pnpm resolves — `pnpm install --frozen-lockfile`
# skips resolution entirely, while the release's `pnpm deploy --legacy`
# re-resolves from scratch. A machine-local setting therefore produced a policy
# that no CI job enforced and that failed for exactly one person, at the last
# step of a release. `pnpm deps:maturity` (scripts/check-dependency-maturity.mjs)
# re-applies this setting to the lockfile on every PR so the gate is enforced
# where the dependency lands, not where it ships.
minimumReleaseAge: 10080

# Versions allowed past the gate. `name` exempts a package outright; the
# `name@version` form exempts one reviewed release and nothing else — prefer it.
minimumReleaseAgeExclude:
  # The @pwrdrvr/agent-kit packages are PwrDrvr's own, freshly published, and
  # pinned — exempt them outright so PwrGit can consume new versions
  # immediately.
  - "@pwrdrvr/codex-app-server-protocol"
  - "@pwrdrvr/agent-core"
  - "@pwrdrvr/agent-transport"
  - "@pwrdrvr/codex-discovery"
  - "@pwrdrvr/agent-client"
  - "@pwrdrvr/agent-acp"
  - "@pwrdrvr/agent-chat-react"

  # zod 4.5.1 arrived via Dependabot (#183) one day after publication, before
  # this repo declared any cooldown, and was merged and shipped through CI on
  # 2026-08-29. Pinned here so the release that carries it is not blocked by a
  # gate the merge never applied. Remove once nothing resolves 4.5.1 —
  # `pnpm deps:maturity` reports the entry as prunable once it has matured.
  - "zod@4.5.1"
