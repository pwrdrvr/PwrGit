appId: com.pwrdrvr.pwrgit
productName: PwrGit
copyright: "Copyright © 2026 PwrDrvr LLC."

# Pinned so `pnpm deploy --prod` works — electron lives in devDependencies
# and is therefore not present in the deploy stage's node_modules.
# Keep this in sync with apps/desktop/package.json devDependencies.electron.
electronVersion: 41.9.0

# dugite's embedded git is downloaded per-arch at install time; this hook
# re-downloads the right slice for each macOS arch pass of the universal
# build. See scripts/beforepack-dugite-arch.mjs.
beforePack: "scripts/beforepack-dugite-arch.mjs"

# Bundle layout
asar: true
asarUnpack:
  - "**/*.node"
compression: normal

# Files included in the app bundle. Run via apps/desktop/scripts/release.mjs
# which first runs `pnpm deploy` to materialize a flat node_modules tree, since
# pnpm's symlinked virtual store interacts poorly with electron-builder's
# default node_modules walk.
files:
  - "out/**/*"
  - "package.json"
  # Compiled JS only — drop sources, declarations, and sourcemaps.
  - "!**/*.map"
  - "!**/*.ts"
  - "!**/*.tsx"
  - "!**/*.d.ts"
  - "!**/tsconfig*.json"
  # Tests of any flavor.
  - "!**/*.test.*"
  - "!**/*.spec.*"
  - "!**/__tests__/**"
  - "!**/__mocks__/**"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/e2e/**"
  - "!**/playwright.config.*"
  # Markdown / docs from third-party packages and our own workspace packages.
  # (Workspace packages are inlined by vite/electron-vite into out/; the copies
  # in node_modules are dead weight.)
  - "!**/*.md"
  - "!**/*.mdx"
  - "!**/docs/**"
  # Misc dotfiles and examples that occasionally ship inside dependency tarballs.
  - "!**/.env*"
  - "!**/.npmignore"
  - "!**/.editorconfig"
  - "!**/.eslintrc*"
  - "!**/.prettierrc*"
  - "!**/.github/**"
  # Our own workspace package metadata is unused at runtime — vite inlines.
  - "!**/node_modules/@pwrgit/*/AGENTS.md"
  - "!**/node_modules/@pwrgit/*/src/**"
  # better-sqlite3 ships a native test extension that is not loaded at
  # runtime. If included, @electron/universal sees identical test binaries in
  # both temp app trees and aborts the universal merge.
  - "!**/node_modules/better-sqlite3/build/Release/test_extension.node"
  # dugite's embedded git distribution ships via extraResources (below), not
  # inside the asar: its ~150 `git-<builtin> → git` symlinks break the
  # universal-merge asar writer if placed under app.asar.unpacked. The main
  # process points dugite at it with LOCAL_GIT_DIRECTORY (see
  # src/main/index.ts); only dugite's JS stays in the asar.
  - "!**/node_modules/dugite/git/**"

extraResources:
  - from: CHANGELOG.md
    to: CHANGELOG.md
  # The per-arch git distribution staged by scripts/beforepack-dugite-arch.mjs.
  # Lands at Contents/Resources/git (macOS) / resources/git (Windows), where
  # LOCAL_GIT_DIRECTORY points. @electron/universal lipo-merges the per-arch
  # Mach-O binaries and keeps the (identical) symlinks from the x64 tree.
  - from: node_modules/dugite/git
    to: git

# Electron fuses — ASAR integrity is NOT on by default in electron-builder.
# Enable it explicitly so the runtime aborts if the .asar is tampered with.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: true

mac:
  category: public.app-category.developer-tools
  # No build/icon.icns yet — electron-builder falls back to the stock Electron
  # icon until the app icon lands (generate like the siblings' swift scripts).
  hardenedRuntime: true
  gatekeeperAssess: false
  # mac.notarize: true reads APPLE_API_KEY/APPLE_API_KEY_ID/APPLE_API_ISSUER
  # (preferred for CI) or APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID
  # (acceptable locally) from the environment. Do NOT commit these.
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Helper bundle renames — verify post-build with Activity Monitor that all
  # four child processes carry the PwrGit brand, not "Electron Helper".
  # Note: the field is helperGPUBundleId (capital GPU) per electron-builder
  # source; lowercase 'gpu' silently no-ops.
  helperBundleId: com.pwrdrvr.pwrgit.helper
  helperRendererBundleId: com.pwrdrvr.pwrgit.helper.Renderer
  helperGPUBundleId: com.pwrdrvr.pwrgit.helper.GPU
  helperPluginBundleId: com.pwrdrvr.pwrgit.helper.Plugin
  extendInfo:
    NSHumanReadableCopyright: "Copyright © 2026 PwrDrvr LLC."
    LSMinimumSystemVersion: "12.0"
    LSApplicationCategoryType: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]

dmg:
  # No custom background yet (siblings generate build/dmg-background.png);
  # the layout below still gives the standard app → /Applications drop window.
  window:
    width: 660
    height: 400
  iconSize: 112
  iconTextSize: 12
  contents:
    - x: 170
      y: 230
      type: file
    - x: 500
      y: 230
      type: link
      path: /Applications
  writeUpdateInfo: false

win:
  # Windows .ico is generated by electron-builder from a 512+px build/icon.png
  # once that asset lands; until then the stock Electron icon is used.
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: true
  verifyUpdateCodeSignature: true
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: PwrGit
  artifactName: "${productName}-${version}-windows-${arch}-setup.${ext}"

linux:
  executableName: pwrgit
  category: Development
  maintainer: PwrDrvr LLC
  synopsis: Cross-platform desktop git client
  description: PwrGit is a cross-platform desktop git client in the Pwr family.
  artifactName: "${productName}-${version}-linux-${arch}.${ext}"
  target:
    - target: deb
      arch: [x64, arm64]
  desktop:
    entry:
      Name: PwrGit
      Comment: Cross-platform desktop git client
      StartupWMClass: PwrGit

deb:
  priority: optional

# GitHub Releases are the canonical desktop artifact channel. Every
# CI-published build is born as a GitHub Pre-release; promotion to Latest is a
# separate operator action after the release is validated (release:check
# enforces releaseType stays prerelease).
publish:
  provider: github
  owner: pwrdrvr
  repo: PwrGit
  private: true
  releaseType: prerelease
