<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sticky heads harness</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg-app);
      }
      .harness-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
        align-items: start;
      }
      .harness-caption {
        margin: 0 0 6px;
        font: 500 10.5px/1.2 var(--font-mono);
        color: var(--text-muted);
      }
      .harness-host {
        height: 420px;
        border: 1px solid var(--border-subtle);
        border-radius: 6px;
        background: var(--bg-app);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
