name: Release Desktop (macOS universal + Windows)

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*" # pre-release tags like v0.0.1-alpha.0
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.0.1-alpha.1). Must already exist on the repo."
        required: true
        type: string

permissions:
  contents: read
  id-token: none

jobs:
  prepare:
    name: Test and prepare signing input
    runs-on: macos-15 # Apple Silicon GH-hosted runner; matches signing identity
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: none
    outputs:
      signing-input-sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@7c109865ae9af59c6fcd2f2a0e8cc851f6ded26a # v1
        with:
          node-version: 24.x

      - name: Check release metadata
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: pnpm release:check

      - name: Typecheck
        run: pnpm typecheck

      # vitest runs under Node, but the postinstall electron-rebuild leaves
      # better-sqlite3 built for Electron's ABI. Rebuild for Node before the
      # unit suite; must run from apps/desktop (a root-level rebuild silently
      # no-ops because better-sqlite3 is a desktop dep).
      - name: Rebuild better-sqlite3 for Node
        working-directory: apps/desktop
        run: pnpm rebuild better-sqlite3

      - name: Test (unit)
        run: pnpm test

      # Restore the Electron-ABI native build before staging — the release
      # stage ships whatever better-sqlite3 binary is in node_modules, and the
      # packaged app loads it under Electron, not Node.
      - name: Restore Electron-ABI native build
        run: pnpm --filter @pwrgit/desktop run rebuild:electron-native

      - name: Prepare release stage
        run: node apps/desktop/scripts/release.mjs --prepare-only

      - name: Archive signing input
        id: archive
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/desktop-release-signing-input.tgz"
          tar -czf "$tarball" \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            CHANGELOG.md \
            scripts/check-desktop-release-metadata.mjs \
            apps/desktop/package.json \
            apps/desktop/electron-builder.yml \
            apps/desktop/release-stage \
            apps/desktop/scripts/release.mjs \
            apps/desktop/scripts/beforepack-dugite-arch.mjs \
            apps/desktop/scripts/verify-asar-contents.mjs \
            apps/desktop/node_modules \
            node_modules
          sha256="$(shasum -a 256 "$tarball" | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          printf "%s  desktop-release-signing-input.tgz\n" "$sha256" \
            > "$RUNNER_TEMP/desktop-release-signing-input.tgz.sha256"

      - name: Upload signing input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-release-signing-input
          path: |
            ${{ runner.temp }}/desktop-release-signing-input.tgz
            ${{ runner.temp }}/desktop-release-signing-input.tgz.sha256
          retention-days: 7

  sign:
    name: Sign, notarize, publish
    runs-on: macos-15
    needs: prepare
    timeout-minutes: 60
    environment: apple-signing
    permissions:
      contents: write # publish releases to the same repo
      id-token: none
    steps:
      - name: Download signing input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-release-signing-input
          path: .release-input

      - name: Verify signing input
        env:
          EXPECTED_SHA256: ${{ needs.prepare.outputs.signing-input-sha256 }}
        run: |
          set -euo pipefail
          cd .release-input
          actual="$(shasum -a 256 desktop-release-signing-input.tgz | awk '{print $1}')"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::signing input SHA-256 mismatch: expected $EXPECTED_SHA256, got $actual" >&2
            exit 1
          fi
          shasum -a 256 --check desktop-release-signing-input.tgz.sha256

      - name: Expand signing input
        run: tar -xzf .release-input/desktop-release-signing-input.tgz

      - name: Sign, notarize, publish
        env:
          # Code signing (Developer ID Application: PwrDrvr LLC, T44CNHC4UH).
          # These come from the apple-signing GitHub Environment, NOT from
          # repository secrets. Protect the environment with required
          # reviewers and a v* tag deployment policy.
          # CSC_LINK is the .p12 base64-encoded; CSC_KEY_PASSWORD is its password.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

          # Notarization via App Store Connect API key.
          # APPLE_API_KEY_BASE64 is the .p8 file base64-encoded; release.mjs
          # decodes it to a temp file before invoking electron-builder.
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: T44CNHC4UH

          # Publish to the private pwrdrvr/PwrGit repo (dogfooding phase).
          GH_TOKEN: ${{ secrets.RELEASES_PAT || github.token }}
        run: node apps/desktop/scripts/release.mjs --sign-stage-only

      - name: Publish stable-name DMG alias
        # PwrGit.dmg is the canonical download URL — it always points at the
        # latest release. Copy-and-upload the versioned DMG under the alias
        # name; --clobber overwrites the prior alias.
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT || github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd apps/desktop/release-stage/dist
          versioned=$(ls PwrGit-*-universal.dmg | head -n 1)
          cp "$versioned" PwrGit.dmg
          gh release upload "$RELEASE_TAG" \
            PwrGit.dmg \
            --repo pwrdrvr/PwrGit \
            --clobber

      - name: Publish release notes from changelog
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT || github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/RELEASE_NOTES.md"
          node scripts/check-desktop-release-metadata.mjs \
            --tag "$RELEASE_TAG" \
            --notes-file "$notes"
          gh release edit "$RELEASE_TAG" \
            --repo pwrdrvr/PwrGit \
            --notes-file "$notes"
          body_length="$(gh release view "$RELEASE_TAG" \
            --repo pwrdrvr/PwrGit \
            --json body \
            --jq '.body | length')"
          if [ "$body_length" -le 0 ]; then
            echo "::error::Release $RELEASE_TAG still has an empty body" >&2
            exit 1
          fi
          is_prerelease="$(gh release view "$RELEASE_TAG" \
            --repo pwrdrvr/PwrGit \
            --json isPrerelease \
            --jq '.isPrerelease')"
          if [ "$is_prerelease" != "true" ]; then
            echo "::error::Release $RELEASE_TAG was not born as a GitHub Pre-release" >&2
            exit 1
          fi

      - name: Upload release artifacts (debug retention)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: desktop-release-artifacts
          path: |
            apps/desktop/release-stage/dist/*.dmg
            apps/desktop/release-stage/dist/*.zip
            apps/desktop/release-stage/dist/*.blockmap
            apps/desktop/release-stage/dist/latest-mac.yml
            apps/desktop/release-stage/dist/builder-debug.yml
          retention-days: 30

  windows:
    name: Sign and publish Windows installer
    runs-on: windows-latest
    needs: [prepare, sign]
    timeout-minutes: 45
    environment: windows-signing
    permissions:
      contents: write # publish releases to the same repo
      id-token: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release metadata
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: pnpm release:check

      - name: Sign and publish Windows installer
        if: ${{ vars.WINDOWS_UNSIGNED_RELEASE != 'true' }}
        env:
          # Authenticode certificate for PwrDrvr LLC. These come from the
          # protected windows-signing environment, not repository-wide secrets.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.RELEASES_PAT || github.token }}
        run: node apps/desktop/scripts/release.mjs --win --publish

      # Until the Windows signing cert lands, set the repo/environment variable
      # WINDOWS_UNSIGNED_RELEASE=true to publish a clearly-labeled unsigned
      # installer instead. No updater feed (latest.yml) is published this way.
      - name: Build unsigned Windows installer
        if: ${{ vars.WINDOWS_UNSIGNED_RELEASE == 'true' }}
        run: node apps/desktop/scripts/release.mjs --win --unsigned-release

      - name: Publish unsigned Windows installer
        if: ${{ vars.WINDOWS_UNSIGNED_RELEASE == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT || github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "GH_TOKEN is required to upload unsigned Windows release artifacts."
          }

          $dist = "apps/desktop/release-stage/dist"
          $installer = Get-ChildItem -Path $dist -Filter "*-setup.exe" | Select-Object -First 1
          if ($null -eq $installer) {
            throw "No Windows installer found in $dist"
          }

          $unsignedName = $installer.Name -replace "-setup\.exe$", "-unsigned-setup.exe"
          $unsignedPath = Join-Path $dist $unsignedName
          Copy-Item -Path $installer.FullName -Destination $unsignedPath -Force
          gh release upload $env:RELEASE_TAG `
            $unsignedPath `
            --repo pwrdrvr/PwrGit `
            --clobber

      - name: Upload Windows release artifacts (debug retention)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: desktop-release-windows-artifacts
          path: |
            apps/desktop/release-stage/dist/*-setup.exe
            apps/desktop/release-stage/dist/*-setup.exe.blockmap
            apps/desktop/release-stage/dist/SHA256SUMS
            apps/desktop/release-stage/dist/latest.yml
            apps/desktop/release-stage/dist/builder-debug.yml
          retention-days: 30
