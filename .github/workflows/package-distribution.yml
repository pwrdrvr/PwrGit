name: Validate package manager distribution

# Releases born as prereleases are ineligible. Promotion emits `edited` when
# performed with a maintainer token; the release skill also dispatches this
# explicitly because events produced by GITHUB_TOKEN do not start workflows.
on:
  release:
    types: [published, released, edited]
  workflow_dispatch:
    inputs:
      force_validation:
        description: Re-run native validation even when the exact inputs already passed
        type: boolean
        default: false
  schedule:
    - cron: "41 11 * * *"
  pull_request:
    paths:
      - scripts/package-manager-release*
      - scripts/release/verify-*
      - scripts/lib/cli-entrypoint.mjs
      - scripts/release/sync-homebrew*
      - .github/workflows/package-distribution.yml

permissions:
  contents: read

concurrency:
  group: package-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: ${{ github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft) }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      arm64_cache: ${{ steps.plan.outputs.arm64_cache }}
      universal_cache: ${{ steps.plan.outputs.universal_cache }}
      windows_cache: ${{ steps.plan.outputs.windows_cache }}
      macos_validation: ${{ steps.plan.outputs.macos_validation }}
      windows_validation: ${{ steps.plan.outputs.windows_validation }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Audit publication and plan validation without downloading installers
        id: plan
        env:
          # A dedicated public-read PAT uses user authentication for the
          # cross-repository search; retain the workflow token for fork PRs.
          GH_TOKEN: ${{ secrets.DISTRIBUTION_READ_TOKEN || github.token }}
          TOKEN_SOURCE: ${{ secrets.DISTRIBUTION_READ_TOKEN && 'DISTRIBUTION_READ_TOKEN' || 'GITHUB_TOKEN' }}
        run: |
          set -euo pipefail
          echo "Distribution API token source: $TOKEN_SOURCE"
          tag="$(gh api repos/pwrdrvr/PwrGit/releases/latest --jq .tag_name)"
          node scripts/package-manager-release.mjs plan "$tag" "$RUNNER_TEMP/distribution" "${{ hashFiles('scripts/package-manager-release.mjs', 'scripts/lib/cli-entrypoint.mjs', 'scripts/release/verify-*', '.github/workflows/package-distribution.yml') }}"
      - name: Upload metadata plan (native validation is separate)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-manager-plan
          path: |
            ${{ runner.temp }}/distribution/Casks
            ${{ runner.temp }}/distribution/manifests
            ${{ runner.temp }}/distribution/distribution-status.json
          retention-days: 14
          if-no-files-found: error

  homebrew:
    needs: [prepare, macos]
    if: github.event_name != 'pull_request' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Publish Homebrew through the tap and verify main
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_READ_TOKEN || github.token }}
          HOMEBREW_TAP_DISPATCH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release/sync-homebrew.mjs "${{ needs.prepare.outputs.version }}"

  freshness:
    needs: [prepare, homebrew]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Compare channel publication after Homebrew synchronization
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_READ_TOKEN || github.token }}
        run: node scripts/package-manager-release.mjs audit --check

  macos:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: validated
        with:
          path: ${{ runner.temp }}/distribution/.validated-macos
          key: distribution-validated-v1-macos-26-${{ needs.prepare.outputs.macos_validation }}
      - name: Report reused macOS validation
        if: steps.validated.outputs.cache-hit == 'true' && !inputs.force_validation
        run: echo 'Exact release bytes and validator inputs already passed macOS validation; no installers downloaded or mounted.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_validation
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_validation
        with:
          name: package-manager-plan
          path: ${{ runner.temp }}/distribution
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_validation
        id: arm64
        with:
          path: ${{ runner.temp }}/distribution/downloads/*-arm64.dmg
          key: ${{ needs.prepare.outputs.arm64_cache }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_validation
        id: universal
        with:
          path: ${{ runner.temp }}/distribution/downloads/*-universal.dmg
          key: ${{ needs.prepare.outputs.universal_cache }}
      - name: Acquire and hash macOS bytes, including cache restores
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_validation
        run: node scripts/package-manager-release.mjs download "$RUNNER_TEMP/distribution" macos
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: (steps.validated.outputs.cache-hit != 'true' || inputs.force_validation) && steps.arm64.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/distribution/downloads/*-arm64.dmg
          key: ${{ needs.prepare.outputs.arm64_cache }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: (steps.validated.outputs.cache-hit != 'true' || inputs.force_validation) && steps.universal.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/distribution/downloads/*-universal.dmg
          key: ${{ needs.prepare.outputs.universal_cache }}
      - name: Verify both macOS architectures and signatures
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_validation
        run: bash scripts/release/verify-macos-distribution.sh
      - name: Record successful macOS validation
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_validation
        run: echo '${{ needs.prepare.outputs.macos_validation }}' > "$RUNNER_TEMP/distribution/.validated-macos"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.validated.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/distribution/.validated-macos
          key: distribution-validated-v1-macos-26-${{ needs.prepare.outputs.macos_validation }}

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: validated
        with:
          path: ${{ runner.temp }}/distribution/.validated-windows
          key: distribution-validated-v1-windows-latest-x64-${{ needs.prepare.outputs.windows_validation }}
      - name: Report reused Windows validation
        if: steps.validated.outputs.cache-hit == 'true' && !inputs.force_validation
        shell: pwsh
        run: Add-Content $env:GITHUB_STEP_SUMMARY 'Exact release bytes and validator inputs already passed Windows validation; no installer download or installation.'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_validation
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_validation
        with:
          name: package-manager-plan
          path: ${{ runner.temp }}/distribution
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_validation
        id: installer
        with:
          path: ${{ runner.temp }}/distribution/downloads/*-windows-x64-setup.exe
          key: ${{ needs.prepare.outputs.windows_cache }}
      - name: Acquire and hash Windows bytes, including cache restores
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_validation
        shell: pwsh
        run: node scripts/package-manager-release.mjs download "$env:RUNNER_TEMP/distribution" windows
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: (steps.validated.outputs.cache-hit != 'true' || inputs.force_validation) && steps.installer.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/distribution/downloads/*-windows-x64-setup.exe
          key: ${{ needs.prepare.outputs.windows_cache }}
      - name: Install the official WinGet client
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command winget -ErrorAction SilentlyContinue) { winget --version }
          Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery
          # Use the current client/schema as the runner account, not all-users.
          Repair-WinGetPackageManager -Latest -Force
          Assert-WinGetPackageManager -Latest
          winget --version
          if ($LASTEXITCODE -ne 0) { throw 'The repaired WinGet client is not executable' }
      - name: Validate manifest, signed installer, install and upgrade
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_validation
        shell: pwsh
        run: ./scripts/release/verify-winget-install.ps1 -Directory "$env:RUNNER_TEMP/distribution"
      - name: Record successful Windows validation
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_validation
        shell: pwsh
        run: Set-Content "$env:RUNNER_TEMP/distribution/.validated-windows" '${{ needs.prepare.outputs.windows_validation }}'
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.validated.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/distribution/.validated-windows
          key: distribution-validated-v1-windows-latest-x64-${{ needs.prepare.outputs.windows_validation }}

  submissions:
    needs: [prepare, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-manager-plan
          path: distribution
      - name: Upload submissions after both native validators passed or were reused
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-manager-submissions
          path: distribution
          retention-days: 14
          if-no-files-found: error
