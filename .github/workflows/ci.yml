name: CI

on:
  push:
    branches:
      - main
  pull_request:
    # Do not add `labeled` here. Dependabot applies labels to dependency PRs,
    # and label-triggered CI creates skipped check suites that can make those
    # PRs appear to have no real status checks. Label-gated builds live in
    # preview-build.yml.
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  # Supersede older runs for the same PR, while keeping every main commit.
  # Group pushes by SHA: a shared branch group can discard pending commits
  # even with cancel-in-progress disabled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # Keep the pull_request trigger path-unfiltered so the required check jobs
  # exist on every PR. Docs/Dependabot-only PRs skip those jobs below instead.
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      code_impacting: ${{ steps.classify.outputs.code_impacting }}
    steps:
      - name: Classify changed files
        id: classify
        uses: actions/github-script@v9
        with:
          script: |
            const fullCi = (reason) => {
              core.setOutput("code_impacting", "true");
              core.notice(`Running full CI: ${reason}`);
            };

            if (context.eventName !== "pull_request") {
              fullCi(`${context.eventName} events always run full CI`);
              return;
            }

            let files;
            try {
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });
            } catch (error) {
              fullCi(`changed-file lookup failed (${error.message})`);
              return;
            }

            const reportedCount = context.payload.pull_request.changed_files;
            if (files.length === 0 || files.length !== reportedCount) {
              fullCi(
                `changed-file list was incomplete (received ${files.length} of ${reportedCount})`,
              );
              return;
            }

            const isNonCodePath = (path) =>
              path === ".github/dependabot.yml" ||
              path.startsWith("docs/") || path.toLowerCase().endsWith(".md");
            const codeImpactingFile = files.find((file) => {
              const paths = [file.filename, file.previous_filename].filter(Boolean);
              return paths.some((path) => !isNonCodePath(path));
            });
            const nonCodeOnly = codeImpactingFile === undefined;

            core.setOutput("code_impacting", String(!nonCodeOnly));
            await core.summary
              .addHeading("Changed-file classification")
              .addTable([
                [{data: "Classification", header: true}, {data: "Files", header: true}],
                [nonCodeOnly ? "Non-code only" : "Code impacting", String(files.length)],
              ])
              .addRaw(
                nonCodeOnly
                  ? "Only documentation or Dependabot configuration changed; expensive CI jobs are skipped."
                  : `Full CI runs because \`${codeImpactingFile.filename}\` requires it.`,
              )
              .write();

  # Completed-tree producers frozen-install and save inline on exact misses;
  # exact hits only probe. Linux and Windows consumers restore without running
  # installs or lifecycle scripts. Keep every cache input/policy identical
  # within each platform group; OS, architecture, image family and ABI stay split.
  install-deps:
    name: Install Dependencies
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code_impacting == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@d416c1c78119b25fe03ee3ef78b75af0d69b10a7 # v1.7.1
        with:
          node-version: 24.22.1
          dependency-cache: node-modules
          cache-mode: populate
          cache-key-suffix: pwrgit-tree-d416c1c78119b25fe03ee3ef78b75af0d69b10a7-v1
          cache-inputs: |
            .nvmrc
            scripts/check-node-version.mjs
            scripts/linux-sandbox.mjs
            scripts/lib/cli-entrypoint.mjs
            scripts/resource-run.mjs
            scripts/lib/tool-processes.mjs
            scripts/tool-resource-policy.mjs
            scripts/windows-tool-job.mjs
            scripts/windows-tool-job.ps1
            apps/desktop/scripts/install-electron-binary.mjs
            apps/desktop/scripts/rebuild-native-for-electron.mjs
            apps/desktop/scripts/stage-better-sqlite3-arch.mjs

  windows-install-deps:
    name: Install Dependencies (Windows)
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.code_impacting == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@d416c1c78119b25fe03ee3ef78b75af0d69b10a7 # v1.7.1
        with:
          node-version: 24.22.1
          dependency-cache: node-modules
          cache-mode: populate
          cache-key-suffix: pwrgit-tree-d416c1c78119b25fe03ee3ef78b75af0d69b10a7-v1
          cache-inputs: |
            .nvmrc
            scripts/check-node-version.mjs
            scripts/linux-sandbox.mjs
            scripts/lib/cli-entrypoint.mjs
            scripts/resource-run.mjs
            scripts/lib/tool-processes.mjs
            scripts/tool-resource-policy.mjs
            scripts/windows-tool-job.mjs
            scripts/windows-tool-job.ps1
            apps/desktop/scripts/install-electron-binary.mjs
            apps/desktop/scripts/rebuild-native-for-electron.mjs
            apps/desktop/scripts/stage-better-sqlite3-arch.mjs

  typecheck:
    # The job `name:` is pinned: the "Protect main" ruleset lists `Typecheck`
    # as a required status check, so renaming this job would leave that check
    # permanently pending and block every PR. The job now runs the whole
    # `pnpm lint` chain (typecheck is its last and slowest link).
    name: Typecheck
    runs-on: ubuntu-latest
    needs: [changes, install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    env:
      # Completed-tree consumers must never trigger pnpm implicit installs.
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@d416c1c78119b25fe03ee3ef78b75af0d69b10a7 # v1.7.1
        with:
          node-version: 24.22.1
          dependency-cache: node-modules
          cache-mode: restore
          cache-key-suffix: pwrgit-tree-d416c1c78119b25fe03ee3ef78b75af0d69b10a7-v1
          cache-inputs: |
            .nvmrc
            scripts/check-node-version.mjs
            scripts/linux-sandbox.mjs
            scripts/lib/cli-entrypoint.mjs
            scripts/resource-run.mjs
            scripts/lib/tool-processes.mjs
            scripts/tool-resource-policy.mjs
            scripts/windows-tool-job.mjs
            scripts/windows-tool-job.ps1
            apps/desktop/scripts/install-electron-binary.mjs
            apps/desktop/scripts/rebuild-native-for-electron.mjs
            apps/desktop/scripts/stage-better-sqlite3-arch.mjs

      # prepare builds outside node_modules, so the archive cannot carry it.
      - name: Build MCP server workspace output
        run: pnpm --filter @pwrgit/mcp-server build

      # Keep repository checks in the aggregate pnpm lint chain.
      - name: Lint (colors, licenses, boundaries, typecheck)
        run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    env:
      # Completed-tree consumers must never trigger pnpm implicit installs.
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@d416c1c78119b25fe03ee3ef78b75af0d69b10a7 # v1.7.1
        with:
          node-version: 24.22.1
          dependency-cache: node-modules
          cache-mode: restore
          cache-key-suffix: pwrgit-tree-d416c1c78119b25fe03ee3ef78b75af0d69b10a7-v1
          cache-inputs: |
            .nvmrc
            scripts/check-node-version.mjs
            scripts/linux-sandbox.mjs
            scripts/lib/cli-entrypoint.mjs
            scripts/resource-run.mjs
            scripts/lib/tool-processes.mjs
            scripts/tool-resource-policy.mjs
            scripts/windows-tool-job.mjs
            scripts/windows-tool-job.ps1
            apps/desktop/scripts/install-electron-binary.mjs
            apps/desktop/scripts/rebuild-native-for-electron.mjs
            apps/desktop/scripts/stage-better-sqlite3-arch.mjs

      - name: Build
        run: pnpm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [changes, install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    env:
      # Completed-tree consumers must never trigger pnpm implicit installs.
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@d416c1c78119b25fe03ee3ef78b75af0d69b10a7 # v1.7.1
        with:
          node-version: 24.22.1
          dependency-cache: node-modules
          cache-mode: restore
          cache-key-suffix: pwrgit-tree-d416c1c78119b25fe03ee3ef78b75af0d69b10a7-v1
          cache-inputs: |
            .nvmrc
            scripts/check-node-version.mjs
            scripts/linux-sandbox.mjs
            scripts/lib/cli-entrypoint.mjs
            scripts/resource-run.mjs
            scripts/lib/tool-processes.mjs
            scripts/tool-resource-policy.mjs
            scripts/windows-tool-job.mjs
            scripts/windows-tool-job.ps1
            apps/desktop/scripts/install-electron-binary.mjs
            apps/desktop/scripts/rebuild-native-for-electron.mjs
            apps/desktop/scripts/stage-better-sqlite3-arch.mjs

      # prepare builds outside node_modules, so the archive cannot carry it.
      - name: Build MCP server workspace output
        run: pnpm --filter @pwrgit/mcp-server build

      # A fresh `pnpm i` already leaves better-sqlite3 ready for both runtimes
      # (see the root AGENTS.md), so this exits immediately. It earns its
      # place on jobs that restore a cached node_modules: the rebuild script
      # is idempotent and repairs whichever half of the pair is stale.
      - name: Ensure better-sqlite3 native builds are current
        run: pnpm --filter @pwrgit/desktop run rebuild:electron-native

      - name: Test
        run: |
          git --version
          pnpm run test
        env:
          PWRGIT_GIT_DIAGNOSTICS_DIR: ${{ runner.temp }}/git-tripwires
          PWRGIT_TEST_GIT: installed

      - name: Upload Git tripwires
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: git-tripwires-${{ runner.os }}
          path: ${{ runner.temp }}/git-tripwires
          if-no-files-found: ignore
          retention-days: 14

  desktop-e2e:
    name: Linux Desktop E2E (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: [changes, install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      # Completed-tree consumers must never trigger pnpm implicit installs.
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@d416c1c78119b25fe03ee3ef78b75af0d69b10a7 # v1.7.1
        with:
          node-version: 24.22.1
          dependency-cache: node-modules
          cache-mode: restore
          cache-key-suffix: pwrgit-tree-d416c1c78119b25fe03ee3ef78b75af0d69b10a7-v1
          cache-inputs: |
            .nvmrc
            scripts/check-node-version.mjs
            scripts/linux-sandbox.mjs
            scripts/lib/cli-entrypoint.mjs
            scripts/resource-run.mjs
            scripts/lib/tool-processes.mjs
            scripts/tool-resource-policy.mjs
            scripts/windows-tool-job.mjs
            scripts/windows-tool-job.ps1
            apps/desktop/scripts/install-electron-binary.mjs
            apps/desktop/scripts/rebuild-native-for-electron.mjs
            apps/desktop/scripts/stage-better-sqlite3-arch.mjs

      # prepare builds outside node_modules, so the archive cannot carry it.
      - name: Build MCP server workspace output
        run: pnpm --filter @pwrgit/mcp-server build

      - name: Run desktop Electron E2E specs
        # No `playwright install-deps` step: `ubuntu-latest` ships
        # Chrome + Firefox preinstalled, which drag in the GTK +
        # libnss / libgbm / libasound stack Electron needs under xvfb.
        # PwrAgnt/PwrSnap CI have run Electron E2E this way for months.
        # As on Windows, workers remains 1 within each runner and
        # `--fully-parallel` lets Playwright balance individual tests across
        # the two shards instead of assigning uneven whole spec files.
        run: xvfb-run --auto-servernum pnpm --filter @pwrgit/desktop test:e2e --fully-parallel --shard=${{ matrix.shard }}/2

      - name: Upload desktop Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: desktop-e2e-artifacts-${{ matrix.shard }}
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 30

  macos-install-deps:
    name: Install Dependencies (macOS)
    runs-on: macos-26
    needs: changes
    if: needs.changes.outputs.code_impacting == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@d416c1c78119b25fe03ee3ef78b75af0d69b10a7 # v1.7.1
        with:
          node-version: 24.22.1
          dependency-cache: node-modules
          cache-mode: populate
          cache-key-suffix: pwrgit-tree-d416c1c78119b25fe03ee3ef78b75af0d69b10a7-v1
          cache-inputs: |
            .nvmrc
            scripts/check-node-version.mjs
            scripts/linux-sandbox.mjs
            scripts/lib/cli-entrypoint.mjs
            scripts/resource-run.mjs
            scripts/lib/tool-processes.mjs
            scripts/tool-resource-policy.mjs
            scripts/windows-tool-job.mjs
            scripts/windows-tool-job.ps1
            apps/desktop/scripts/install-electron-binary.mjs
            apps/desktop/scripts/rebuild-native-for-electron.mjs
            apps/desktop/scripts/stage-better-sqlite3-arch.mjs

  macos-e2e:
    name: macOS Desktop E2E (${{ matrix.shard }}/4)
    runs-on: macos-26
    needs: [changes, macos-install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Completed-tree consumers must never trigger pnpm implicit installs.
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        timeout-minutes: 10

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@d416c1c78119b25fe03ee3ef78b75af0d69b10a7 # v1.7.1
        timeout-minutes: 10
        with:
          node-version: 24.22.1
          dependency-cache: node-modules
          cache-mode: restore
          cache-key-suffix: pwrgit-tree-d416c1c78119b25fe03ee3ef78b75af0d69b10a7-v1
          cache-inputs: |
            .nvmrc
            scripts/check-node-version.mjs
            scripts/linux-sandbox.mjs
            scripts/lib/cli-entrypoint.mjs
            scripts/resource-run.mjs
            scripts/lib/tool-processes.mjs
            scripts/tool-resource-policy.mjs
            scripts/windows-tool-job.mjs
            scripts/windows-tool-job.ps1
            apps/desktop/scripts/install-electron-binary.mjs
            apps/desktop/scripts/rebuild-native-for-electron.mjs
            apps/desktop/scripts/stage-better-sqlite3-arch.mjs

      # prepare builds outside node_modules, so the archive cannot carry it.
      - name: Build MCP server workspace output
        run: pnpm --filter @pwrgit/mcp-server build

      - name: Run desktop Electron E2E specs (macOS)
        # Hosted macOS runners are VMs with a logged-in desktop. Software
        # rendering avoids virtual GPU resets (see e2e/AGENTS.md).
        timeout-minutes: 20
        env:
          PWRGIT_E2E_DISABLE_GPU: "1"
        run: pnpm --filter @pwrgit/desktop test:e2e --fully-parallel --shard=${{ matrix.shard }}/4

      - name: Upload desktop Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: macos-desktop-e2e-artifacts-${{ matrix.shard }}
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 30

  desktop-e2e-result:
    # Preserve the required status-check context across the Linux, macOS and
    # Windows matrix jobs. `always()` is required so a failed shard reaches
    # this job and cannot turn the aggregate check into a skip — branch
    # protection counts a skipped required check as satisfied, so without it
    # the gate would stop gating in exactly the case it exists for.
    name: Desktop E2E
    runs-on: ubuntu-latest
    needs: [changes, desktop-e2e, macos-e2e, windows-e2e]
    if: >-
      always() &&
      needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 5
    steps:
      - name: Require Linux, macOS and Windows Desktop E2E shards
        env:
          LINUX_E2E_RESULT: ${{ needs.desktop-e2e.result }}
          MACOS_E2E_RESULT: ${{ needs.macos-e2e.result }}
          WINDOWS_E2E_RESULT: ${{ needs.windows-e2e.result }}
        run: |
          set -euo pipefail

          # Mirror each line into the job summary so the PR checks page names
          # the platform that broke without anyone opening the job log.
          say() {
            echo "$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          # Report every platform before exiting, so a red gate names the
          # platform that broke instead of stopping at the first check and
          # hiding whether the others were healthy.
          status=0
          require() {
            if [[ "$2" == "success" ]]; then
              say "- PASS \`$1\` ($2)"
            else
              say "- FAIL \`$1\` ($2)"
              echo "::error::$1 Desktop E2E did not succeed ($2)."
              status=1
            fi
          }

          say "### Desktop E2E platform results"
          require "Linux" "$LINUX_E2E_RESULT"
          require "macOS" "$MACOS_E2E_RESULT"
          # Every lane is GitHub-hosted and carries the same `if` as the Linux
          # matrix, so every non-success is a real failure, a `skipped` from a
          # broken install job included.
          require "Windows" "$WINDOWS_E2E_RESULT"

          exit "$status"
  windows:
    name: Windows (typecheck + build + test)
    runs-on: windows-latest
    needs: [changes, windows-install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 20
    env:
      # Completed-tree consumers must never trigger pnpm implicit installs.
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Same action as the Linux jobs: it runs natively on Windows (no bash
      # assumptions) and activates the pnpm version pinned in package.json's
      # `packageManager` field via Corepack, so there's no second pnpm pin to
      # drift on upgrade.
      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@d416c1c78119b25fe03ee3ef78b75af0d69b10a7 # v1.7.1
        with:
          node-version: 24.22.1
          dependency-cache: node-modules
          cache-mode: restore
          cache-key-suffix: pwrgit-tree-d416c1c78119b25fe03ee3ef78b75af0d69b10a7-v1
          cache-inputs: |
            .nvmrc
            scripts/check-node-version.mjs
            scripts/linux-sandbox.mjs
            scripts/lib/cli-entrypoint.mjs
            scripts/resource-run.mjs
            scripts/lib/tool-processes.mjs
            scripts/tool-resource-policy.mjs
            scripts/windows-tool-job.mjs
            scripts/windows-tool-job.ps1
            apps/desktop/scripts/install-electron-binary.mjs
            apps/desktop/scripts/rebuild-native-for-electron.mjs
            apps/desktop/scripts/stage-better-sqlite3-arch.mjs

      # prepare builds outside node_modules, so the archive cannot carry it.
      - name: Build MCP server workspace output
        run: pnpm --filter @pwrgit/mcp-server build

      # Deliberately NOT `pnpm lint`. This job exists to catch Windows-specific
      # breakage, and most of the lint chain is platform-independent static
      # analysis (`lint:colors` scans CSS text; `lint:boundaries` walks the
      # import graph) — re-running it on the pricier Windows runner buys
      # nothing. `licenses:check` is the exception worth keeping here: it
      # normalizes path separators (`split(sep).join("/")`) and CRLF line
      # endings while diffing the checked-in THIRD_PARTY_LICENSES, and that
      # normalization code only actually gets exercised on Windows.
      - name: Check package license policy and third-party notices
        run: pnpm licenses:check

      # Same native-build guard as the Linux test job (see comment there).
      - name: Ensure better-sqlite3 native builds are current
        run: pnpm --filter @pwrgit/desktop run rebuild:electron-native

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: |
          git --version
          pnpm run test
        env:
          PWRGIT_GIT_DIAGNOSTICS_DIR: ${{ runner.temp }}/git-tripwires
          PWRGIT_TEST_GIT: installed

      - name: Upload Git tripwires
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: git-tripwires-${{ runner.os }}
          path: ${{ runner.temp }}/git-tripwires
          if-no-files-found: ignore
          retention-days: 14

  windows-e2e:
    name: Windows Desktop E2E (${{ matrix.shard }}/4)
    runs-on: windows-latest
    needs: [changes, windows-install-deps]
    if: needs.changes.outputs.code_impacting == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Completed-tree consumers must never trigger pnpm implicit installs.
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@d416c1c78119b25fe03ee3ef78b75af0d69b10a7 # v1.7.1
        with:
          node-version: 24.22.1
          dependency-cache: node-modules
          cache-mode: restore
          cache-key-suffix: pwrgit-tree-d416c1c78119b25fe03ee3ef78b75af0d69b10a7-v1
          cache-inputs: |
            .nvmrc
            scripts/check-node-version.mjs
            scripts/linux-sandbox.mjs
            scripts/lib/cli-entrypoint.mjs
            scripts/resource-run.mjs
            scripts/lib/tool-processes.mjs
            scripts/tool-resource-policy.mjs
            scripts/windows-tool-job.mjs
            scripts/windows-tool-job.ps1
            apps/desktop/scripts/install-electron-binary.mjs
            apps/desktop/scripts/rebuild-native-for-electron.mjs
            apps/desktop/scripts/stage-better-sqlite3-arch.mjs

      # prepare builds outside node_modules, so the archive cannot carry it.
      - name: Build MCP server workspace output
        run: pnpm --filter @pwrgit/mcp-server build

      - name: Run desktop Electron E2E specs (Windows)
        # windows-latest provides an interactive desktop session, so (unlike
        # the Linux job) no xvfb is needed. `--fully-parallel` only changes
        # sharding granularity here: each runner still has workers=1, while
        # Playwright can balance individual tests 34/34/33/33 instead of
        # assigning whole, very uneven spec files to a shard.
        run: pnpm --filter @pwrgit/desktop test:e2e --fully-parallel --shard=${{ matrix.shard }}/4

      - name: Upload desktop Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: windows-desktop-e2e-artifacts-${{ matrix.shard }}
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 30
