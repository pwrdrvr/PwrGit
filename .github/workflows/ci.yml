name: CI

on:
  push:
    branches:
      - main
  pull_request:
    # Do not add `labeled` here. Dependabot applies labels to dependency PRs,
    # and label-triggered CI creates skipped check suites that can make those
    # PRs appear to have no real status checks. Label-gated builds live in
    # preview-build.yml.
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  # Cache-priming gate. `lookup-only` makes this ~1s on a hit; on a miss it
  # pays one cold install and saves the cache inline (not in a post step), so
  # the fan-out below restores instead of each job installing from scratch.
  # The cache key includes runner OS and arch, so Windows needs its own gate —
  # see `windows-install-deps`. Gate and consumers must agree on every
  # key-forming input (`node-version` major, `working-directory`, …).
  install-deps:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        with:
          node-version: 24.x
          lookup-only: "true"

  windows-install-deps:
    name: Install Dependencies (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        with:
          node-version: 24.x
          lookup-only: "true"

  typecheck:
    # The job `name:` is pinned: the "Protect main" ruleset lists `Typecheck`
    # as a required status check, so renaming this job would leave that check
    # permanently pending and block every PR. The job now runs the whole
    # `pnpm lint` chain (typecheck is its last and slowest link).
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        with:
          node-version: 24.x

      # One aggregate step on purpose: `pnpm lint` chains the checks
      # cheapest-first (colors, package reservation, licenses, boundaries,
      # typecheck), so a new check is added to the chain in package.json and
      # picked up here automatically instead of having to be remembered as
      # another step.
      - name: Lint (colors, package reservation, licenses, boundaries, typecheck)
        run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        with:
          node-version: 24.x

      - name: Build
        run: pnpm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        with:
          node-version: 24.x

      # A fresh `pnpm i` already leaves better-sqlite3 built for both ABIs
      # (see the root AGENTS.md), so this exits immediately. It earns its
      # place on jobs that restore a cached node_modules: the rebuild script
      # is idempotent and repairs whichever half of the pair is stale.
      - name: Ensure better-sqlite3 native builds are current
        run: pnpm --filter @pwrgit/desktop run rebuild:electron-native

      - name: Test
        run: pnpm run test

  desktop-e2e:
    name: Desktop E2E
    runs-on: ubuntu-latest
    needs: install-deps
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        with:
          node-version: 24.x

      - name: Run desktop Electron E2E specs
        # No `playwright install-deps` step: `ubuntu-latest` ships
        # Chrome + Firefox preinstalled, which drag in the GTK +
        # libnss / libgbm / libasound stack Electron needs under xvfb.
        # PwrAgnt/PwrSnap CI have run Electron E2E this way for months.
        run: xvfb-run --auto-servernum pnpm run test:desktop-e2e

      - name: Upload desktop Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: desktop-e2e-artifacts
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 30

  windows:
    name: Windows (typecheck + build + test)
    runs-on: windows-latest
    needs: windows-install-deps
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Same action as the Linux jobs: it runs natively on Windows (no bash
      # assumptions) and activates the pnpm version pinned in package.json's
      # `packageManager` field via Corepack, so there's no second pnpm pin to
      # drift on upgrade.
      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        with:
          node-version: 24.x

      # Deliberately NOT `pnpm lint`. This job exists to catch Windows-specific
      # breakage, and most of the lint chain is platform-independent static
      # analysis (`lint:colors` scans CSS text; `lint:boundaries` walks the
      # import graph) — re-running it on the pricier Windows runner buys
      # nothing. `licenses:check` is the exception worth keeping here: it
      # normalizes path separators (`split(sep).join("/")`) and CRLF line
      # endings while diffing the checked-in THIRD_PARTY_LICENSES, and that
      # normalization code only actually gets exercised on Windows.
      - name: Check package license policy and third-party notices
        run: pnpm licenses:check

      # Same native-build guard as the Linux test job (see comment there).
      - name: Ensure better-sqlite3 native builds are current
        run: pnpm --filter @pwrgit/desktop run rebuild:electron-native

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

  windows-e2e:
    name: Windows Desktop E2E
    runs-on: windows-latest
    needs: windows-install-deps
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        with:
          node-version: 24.x

      - name: Run desktop Electron E2E specs (Windows)
        # windows-latest provides an interactive desktop session, so (unlike
        # the Linux job) no xvfb is needed.
        run: pnpm run test:desktop-e2e

      - name: Upload desktop Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: windows-desktop-e2e-artifacts
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 30
