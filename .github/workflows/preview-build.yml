name: Preview Build (macOS DMG + Windows installer)

on:
  pull_request:
    # `labeled`     — first time the build-preview label is applied.
    # `synchronize` — subsequent pushes to an already-labeled PR; without this,
    #                 the only way to re-run after a fix is to remove and
    #                 re-add the label.
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  preview:
    name: Build preview DMG
    # Run when the just-applied label is build-preview (labeled event), OR when
    # build-preview is already on the PR (synchronize event).
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'build-preview') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'build-preview'))
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5

      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        with:
          node-version: 24.x

      - name: Compute preview version
        id: version
        run: |
          raw=$(node -p "require('./apps/desktop/package.json').version")
          base=$(echo "$raw" | sed 's/-.*//')
          preview="${base}-pr.${{ github.event.pull_request.number }}"
          echo "version=${preview}" >> "$GITHUB_OUTPUT"
          echo "Preview version: ${preview}"

      - name: Set preview version in package.json
        run: |
          cd apps/desktop
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build preview package (unsigned)
        run: pnpm --filter @pwrgit/desktop package:dryrun

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: PwrGit-${{ steps.version.outputs.version }}-preview
          path: apps/desktop/release-stage/dist/*.dmg
          retention-days: 14

  preview-windows:
    name: Build preview installer (Windows)
    # Same build-preview label gate as the macOS preview above. Keeps the
    # Windows pack off every PR/push.
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'build-preview') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'build-preview'))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5

      # Same action as the macOS preview above; it runs natively on Windows.
      # No cache-priming gate job here (unlike ci.yml): this is a label-gated
      # one-off build, so there is no fan-out to prime for.
      - name: Install Node.js and dependencies
        uses: pwrdrvr/configure-nodejs@v1
        with:
          node-version: 24.x

      # windows-latest defaults to pwsh; force bash for the version-stamp steps
      # so they stay identical to the macOS preview job above.
      - name: Compute preview version
        id: version
        shell: bash
        run: |
          raw=$(node -p "require('./apps/desktop/package.json').version")
          base=$(echo "$raw" | sed 's/-.*//')
          preview="${base}-pr.${{ github.event.pull_request.number }}"
          echo "version=${preview}" >> "$GITHUB_OUTPUT"
          echo "Preview version: ${preview}"

      - name: Set preview version in package.json
        shell: bash
        run: |
          cd apps/desktop
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build preview installer (unsigned)
        run: pnpm --filter @pwrgit/desktop package:win

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: PwrGit-${{ steps.version.outputs.version }}-windows-installer
          path: |
            apps/desktop/release-stage/dist/*-setup.exe
            apps/desktop/release-stage/dist/*-setup.exe.blockmap
            apps/desktop/release-stage/dist/SHA256SUMS
            apps/desktop/release-stage/dist/builder-debug.yml
          retention-days: 14
